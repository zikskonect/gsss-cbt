    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        * { transition: all 0.2s ease; }

        .titlebar {
            height: 32px;
            background: #1e3a8a;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 9999;
            -webkit-app-region: drag;
        }

        .titlebar-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            color: white;
            cursor: pointer;
            -webkit-app-region: no-drag;
        }

        .titlebar-button:hover { background: rgba(255, 255, 255, 0.1); }
        .titlebar-button.close:hover { background: #4687e9; }
    </style>
</head>

        <div id="initial-loader" class="flex items-center justify-center min-h-screen relative">

                position: absolute;

                background-image: url('assets/home/gss-app.jpg');

                opacity: 0.15;

    </div>
